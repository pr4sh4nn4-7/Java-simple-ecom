services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: ./env/my_env.env
    container_name: my-java-web-app
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: java-database
    expose:
      - 5432
    env_file: ./env/my_env.env
    volumes:
      - /java_data:/var/lib/postgresql
volumes:
  java_data:
