apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ecom-deployment
spec:
  selector:
    matchLabels:
      app: my-ecom
  replicas: 1
  template:
    metadata:
      labels:
        app: my-ecom
    spec:
      containers:
        - name: java-application
          image: v4gish7/java-ecommerce:latest
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_NAME

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DB_PASS
          ports:
            - containerPort: 8080
---
